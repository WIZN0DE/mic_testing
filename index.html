<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A song for you 💗</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  /* ✏️ Change the words at the top of the <script> at the bottom of this file ✏️ */
  :root{
    --bg1:#ffd6e3; --bg2:#e6d9ff; --ink:#5b3a4a; --rose:#ff6b95; --blush:#ffb3c9;
    --butter:#ffe8a3; --vinyl:#2a1e2c; --card:rgba(255,255,255,.62);
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 20% 15%,var(--bg1),transparent 55%),
               radial-gradient(circle at 85% 85%,var(--bg2),transparent 55%),#fff0f5;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;overflow-x:hidden;
  }
  main{width:min(420px,100%);text-align:center;position:relative;z-index:2}
  h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(2rem,9vw,2.7rem);color:var(--rose);line-height:1.2;text-shadow:0 3px 0 #fff}
  .sub{margin-top:6px;font-size:1.02rem;opacity:.85}

  .player{
    margin-top:22px;padding:22px 18px 20px;border-radius:36px;background:var(--card);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 14px 40px rgba(255,107,149,.25),inset 0 0 0 3px #fff;
  }
  .deck{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto}

  /* the record */
  .vinyl{
    position:absolute;inset:0;border-radius:50%;cursor:pointer;border:0;padding:0;
    background:
      radial-gradient(circle,transparent 0 33%,rgba(255,255,255,.07) 33.5% 34%,transparent 34.5% 100%),
      repeating-radial-gradient(circle,#2a1e2c 0 2px,#3a2b3d 3px 4px),
      var(--vinyl);
    box-shadow:0 10px 24px rgba(91,58,74,.4),0 0 0 6px #fff;
    animation:spin 3.2s linear infinite;animation-play-state:paused;
  }
  .vinyl::before{ /* light shine */
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.22) 16%,transparent 24% 60%,rgba(255,255,255,.18) 66%,transparent 74%);
  }
  .playing .vinyl{animation-play-state:running}
  .label{
    position:absolute;inset:32%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffc2d4,var(--rose));
    display:grid;place-items:center;font-size:clamp(1.4rem,8vw,2.2rem);
    box-shadow:inset 0 0 0 4px var(--butter),inset 0 0 0 6px rgba(255,255,255,.7);
  }
  .label::after{ /* spindle hole */
    content:"";position:absolute;width:11%;aspect-ratio:1;border-radius:50%;background:#fff0f5;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.3);
  }
  .label span{transform:translateY(-34%)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* tonearm */
  .arm{
    position:absolute;top:-4%;right:-3%;width:46%;height:60%;
    transform-origin:80% 10%;transform:rotate(-24deg);
    transition:transform .9s cubic-bezier(.5,.1,.3,1);pointer-events:none;
  }
  .playing .arm{transform:rotate(10deg)}
  .arm .base{position:absolute;top:0;right:5%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--butter);box-shadow:0 0 0 4px #fff,0 4px 10px rgba(0,0,0,.25)}
  .arm .rod{position:absolute;top:8%;right:14%;width:5%;height:78%;border-radius:6px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .arm .head{position:absolute;bottom:8%;right:7.5%;width:14%;height:15%;border-radius:6px 6px 10px 10px;background:var(--rose);box-shadow:0 0 0 3px #fff}

  .hint{margin-top:16px;font-size:.95rem;min-height:1.4em}

  .controls{display:flex;align-items:center;gap:12px;margin-top:10px}
  .play{
    flex:none;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:1.5rem;
    background:linear-gradient(145deg,#ff8fb0,var(--rose));box-shadow:0 6px 0 #e5527d,0 10px 18px rgba(255,107,149,.4);
    transition:transform .1s,box-shadow .1s;
  }
  .play:active{transform:translateY(4px);box-shadow:0 2px 0 #e5527d}
  .play:focus-visible,.vinyl:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
  .bar{flex:1;display:flex;flex-direction:column;gap:4px}
  .times{display:flex;justify-content:space-between;font-size:.82rem;opacity:.8}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;cursor:pointer;
    background:linear-gradient(90deg,var(--rose) var(--p,0%),#fff var(--p,0%));box-shadow:inset 0 0 0 2px var(--blush);
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--butter);border:3px solid var(--rose)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--butter);border:3px solid var(--rose)}

  .note{margin-top:22px;font-size:1.02rem;line-height:1.55;padding:0 6px}
  .from{margin-top:10px;font-family:'Pacifico',cursive;color:var(--rose);font-size:1.15rem}

  /* floating hearts */
  .heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:rise linear forwards;opacity:.0}
  @keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .vinyl{animation-duration:12s}
    .arm{transition:none}
    .heart{display:none}
  }
</style>
</head>
<body>
<main>
  <h1 id="title">A song for you</h1>
  <p class="sub" id="sub"></p>

  <section class="player" id="player">
    <div class="deck">
      <button class="vinyl" id="vinyl" aria-label="Play or pause the song"><div class="label"><span>💗</span></div></button>
      <div class="arm" aria-hidden="true"><div class="rod"></div><div class="head"></div><div class="base"></div></div>
    </div>

    <p class="hint" id="hint">Tap the record to play 💿</p>

    <div class="controls">
      <button class="play" id="play" aria-label="Play">▶</button>
      <div class="bar">
        <input type="range" id="seek" min="0" max="226" step="0.1" value="0" aria-label="Song position">
        <div class="times"><span id="cur">0:00</span><span id="dur">3:46</span></div>
      </div>
    </div>
  </section>

  <p class="note" id="note"></p>
  <p class="from" id="from"></p>
</main>

<audio id="audio" src="19th.mp3.mpeg" preload="metadata"></audio>

<script>
  /* ✏️ EDIT THESE ✏️ */
  const CONFIG = {
    title: "A song for you",
    subtitle: "Made with love, just for [her name]",
    note: "Every word of this song was written with you in mind. Press play, sit back, and listen. 💕",
    from: "— [his name]"
  };

  const $ = id => document.getElementById(id);
  const audio = $('audio'), player = $('player'), seek = $('seek');
  $('title').textContent = CONFIG.title;
  $('sub').textContent = CONFIG.subtitle;
  $('note').textContent = CONFIG.note;
  $('from').textContent = CONFIG.from;
  document.title = CONFIG.title + " 💗";

  const fmt = s => isNaN(s) ? "0:00" : Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,'0');
  let hearts;

  function setUI(playing){
    player.classList.toggle('playing', playing);
    $('play').textContent = playing ? "❚❚" : "▶";
    $('play').setAttribute('aria-label', playing ? "Pause" : "Play");
    $('hint').textContent = playing ? "Now playing 🎶" : (audio.currentTime > 0 ? "Paused. Tap to keep listening 💗" : "Tap the record to play 💿");
    clearInterval(hearts);
    if (playing) hearts = setInterval(floatHeart, 900);
  }
  function toggle(){
    if (audio.paused) audio.play().catch(() => { $('hint').textContent = "Can't find song.mp3. Check the file name 🥺"; });
    else audio.pause();
  }
  function floatHeart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['💗','💖','💕','🌸','✨'][Math.floor(Math.random()*5)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*20) + 'px';
    h.style.animationDuration = (6 + Math.random()*5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 11500);
  }

  $('vinyl').onclick = $('play').onclick = toggle;
  audio.onplay = () => setUI(true);
  audio.onpause = () => setUI(false);
  audio.onended = () => { audio.currentTime = 0; seek.value = 0; paint(); $('hint').textContent = "Press play to hear it again 💞"; };
  audio.onloadedmetadata = () => { seek.max = audio.duration; $('dur').textContent = fmt(audio.duration); };
  audio.ontimeupdate = () => { seek.value = audio.currentTime; paint(); };
  seek.oninput = () => { audio.currentTime = seek.value; paint(); };
  function paint(){
    $('cur').textContent = fmt(audio.currentTime);
    seek.style.setProperty('--p', (seek.value / (seek.max || 1) * 100) + '%');
  }
</script>
</body>
</html>
